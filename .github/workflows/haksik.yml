name: 매일 학식 추출 및 배포

on:
  schedule:
    - cron: '0 0 * * *'  # 한국시간 오전 9시
  workflow_dispatch:

jobs:
  haksik:
    runs-on: macos-latest  # 🍎 macOS로 변경

    steps:
    - name: ✅ 저장소 체크아웃
      uses: actions/checkout@v3

    - name: 🐍 Python 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 🧪 pip 캐시 적용
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 📦 pip 의존성 설치
      run: |
        pip install -r requirements.txt

    - name: 🖥️ 학식 크롤링 실행
      run: |
        python haksik_update.py

    - name: 🚀 index.html로 복사
      run: |
        cp output/haksik_result.html index.html

    - name: 📤 GitHub Pages에 커밋 & 푸시
      run: |
        git config --global user.name "ahnjh05141"
        git config --global user.email "ahnjh05141@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.repository }}
        git add index.html
        git commit -m "Update index.html (auto)" || echo "No changes to commit"
        git push origin HEAD:main

    - name: ✅ Remote 확인
      run: git remote -v