name: 매일 학식 추출 및 배포

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 9AM KST
  workflow_dispatch:

jobs:
  haksik:
    runs-on: macos-latest

    permissions:
      contents: write  # ✅ github-actions[bot]이 푸시할 수 있게 허용

    steps:
    - name: ✅ 저장소 체크아웃
      uses: actions/checkout@v3

    - name: 🐍 Python 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 pip 의존성 설치
      run: |
        pip install -r requirements.txt

    - name: 🖥️ 학식 크롤링 실행
      run: |
        python haksik_update.py

    - name: 🚀 index.html로 복사
      run: |
        cp output/haksik_result.html index.html

    - name: 📤 GitHub Pages에 커밋 & 푸시 (bot으로)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git commit -m "Update index.html (bot)" || echo "No changes"
        git push