name: 매일 학식 추출 및 배포

on:
  schedule:
    - cron: '0 0 * * *'  # 한국시간 09:00
  workflow_dispatch:

jobs:
  haksik:
    runs-on: ubuntu-latest

    steps:
    - name: ✅ 저장소 체크아웃
      uses: actions/checkout@v3

    - name: 🐍 Python 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 🧪 pip 캐시 적용
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 🧱 Install Google Chrome + matching chromedriver
      run: |
        sudo apt update
        sudo apt install -y wget curl unzip gnupg
        curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt update
        sudo apt install -y google-chrome-stable
    
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d '.' -f 1)
        DRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION")
        wget -O chromedriver.zip "https://chromedriver.storage.googleapis.com/$DRIVER_VERSION/chromedriver_linux64.zip"
        unzip chromedriver.zip
        sudo mv chromedriver /usr/bin/chromedriver
        sudo chmod +x /usr/bin/chromedriver

    - name: 📦 pip 의존성 설치
      run: |
        pip install -r requirements.txt

    - name: 🖥️ xvfb + 학식봇 실행
      run: |
        sudo apt install -y xvfb
        xvfb-run python haksik_update.py

    - name: 🚀 index.html로 복사
      run: |
        cp output/haksik_result.html index.html

    - name: 📤 GitHub Pages에 커밋 & 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git commit -m "🔄 Update index.html (자동)"
        git push